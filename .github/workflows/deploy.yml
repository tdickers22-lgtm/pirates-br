# DEPLOY (online-04, online-11, b1.3b). Manual, or a push to `release` (the
# batch gates fast-forward `release` to their last green commit, PLAN rule 8).
#
#   wait-idle -> flyctl deploy --remote-only --ha=false -> smoke-online
#   -> on a red smoke, redeploy the image that was serving before, smoke again.
#
# FLY_API_TOKEN comes ONLY from the repo secret (fly tokens create deploy -a
# pirates-br). test-deploy-config lints this file: the secret-only token,
# --ha=false on every deploy line, wait-idle before and the smoke after the
# deploy, the rollback, and the one-at-a-time concurrency group.
name: deploy
on:
  workflow_dispatch:
  push:
    branches: [release]
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: pirates-br
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Record the image serving now (rollback target)
        id: prev
        run: |
          PREV=$(flyctl machine list -a "$FLY_APP" --json | jq -r '.[0].config.image // empty' || true)
          echo "previous image: ${PREV:-none (first deploy)}"
          echo "image=$PREV" >> "$GITHUB_OUTPUT"
      - name: Wait for an idle host (<= 20 min, then the drain notice covers live matches)
        run: node scripts/wait-idle.mjs --cap-min 20
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false --build-arg BUILD_ID=${{ github.sha }} -a "$FLY_APP"
      - name: Smoke the live URL
        id: smoke
        run: node scripts/smoke-online.mjs --build-id ${{ github.sha }}
      - name: Roll back to the previous image
        if: failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.image != ''
        run: |
          flyctl deploy --image "${{ steps.prev.outputs.image }}" --ha=false -a "$FLY_APP"
          node scripts/smoke-online.mjs --skip-queue
